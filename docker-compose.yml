version: "3.9"

services:
  admin:
    build: .
    container_name: marm_admin
    command: ["python", "-m", "admin_ui"]
    env_file: .env
    environment:
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: ${ADMIN_PORT:-8000}
      DB_PATH: ${DB_PATH:-/data/marm.sqlite3}
    ports:
      - "${ADMIN_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys
          from urllib import request

          response = request.urlopen("http://127.0.0.1:8000/ready", timeout=5)
          sys.exit(0 if response.status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build: .
    container_name: marm_bot
    command: ["python", "-m", "app.main"]
    env_file: .env
    depends_on:
      - admin
    environment:
      DB_PATH: ${DB_PATH:-/data/marm.sqlite3}
      # Если боту нужен токен/другие переменные – добавьте:
      # BOT_TOKEN: ${BOT_TOKEN}
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./reports:/app/reports
    restart: unless-stopped
