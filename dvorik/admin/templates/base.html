<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ page_title or "Dvorik Admin" }}{% endblock %}</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #ffffff;
        --surface-muted: #f5f6f8;
        --text-primary: #1f2933;
        --text-muted: #52606d;
        --accent: #4f46e5;
        --border-soft: #d9e2ec;
        --shadow: 0 20px 40px rgba(15, 23, 42, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #111827;
          --surface-muted: #1f2937;
          --text-primary: #f9fafb;
          --text-muted: #d1d5db;
          --border-soft: #374151;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--surface-muted);
        color: var(--text-primary);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .app-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2.5rem 1.75rem 4rem;
      }

      header.app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        margin-bottom: 2.5rem;
      }

      .branding h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .branding p {
        margin: 0.25rem 0 0;
        color: var(--text-muted);
      }

      .widget-host {
        position: relative;
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .widget-host + .widget-host {
        margin-top: 1.5rem;
      }

      .widget {
        margin: 0;
        padding: 1.75rem 1.75rem 1.5rem;
      }

      .widget header h3 {
        margin: 0 0 0.75rem;
        font-size: 1.125rem;
        font-weight: 600;
      }

      .widget p {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.6;
      }

      .widget-error {
        border-left: 4px solid #ef4444;
        background: rgba(239, 68, 68, 0.08);
      }

      .widget-error__message {
        color: #991b1b;
      }

      .zone-grid {
        display: grid;
        gap: 1.75rem;
      }

      .zone-header {
        margin-bottom: 1rem;
      }

      .zone-empty {
        margin: 0;
        padding: 1.5rem;
        border-radius: 16px;
        border: 1px dashed var(--border-soft);
        color: var(--text-muted);
        text-align: center;
        background: rgba(79, 70, 229, 0.05);
      }

      {% block base_styles %}{% endblock %}
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body class="{{ body_class|default('') }}">
    <div class="app-container">
      <header class="app-header">
        <div class="branding">
          <h1 class="app-title">{% block header_title %}Dvorik Admin{% endblock %}</h1>
          {% block header_subtitle %}{% endblock %}
        </div>
        {% block header_actions %}{% endblock %}
      </header>
      <main class="app-main">
        {% block content %}{% endblock %}
      </main>
    </div>
    {% block body_scripts %}{% endblock %}
  </body>
</html>
